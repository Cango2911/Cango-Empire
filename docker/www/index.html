        padding: var(--space-6);
        gap: var(--space-4);
        transform: translateY(-100%);
        opacity: 0;
        visibility: hidden;
        transition: all var(--duration-base) var(--ease-out);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        z-index: 99;
      }
      
      .nav__menu.active {
        transform: translateY(0);
        opacity: 1;
        visibility: visible;
      }
      
      .nav__toggle {
        display: flex;
      }
      
      .nav__link,
      .nav__cta {
        width: 100%;
        text-align: center;
        padding: var(--space-3) var(--space-4);
      }
      
      /* Hero Section */
      .hero {
        padding-top: calc(var(--nav-height) + var(--space-8));
        padding-bottom: var(--space-12);
        min-height: auto;
      }
      
      .hero__title {
        font-size: clamp(1.75rem, 8vw, var(--text-4xl));
        margin-bottom: var(--space-4);
      }
      
      .hero__subtitle {
        font-size: var(--text-base);
        margin-bottom: var(--space-6);
      }
      
      .hero__stats {
        grid-template-columns: 1fr;
        gap: var(--space-3);
        margin-top: var(--space-8);
      }
      
      .hero__stat {
        padding: var(--space-4);
      }
      
      .hero__stat-value {
        font-size: var(--text-2xl);
      }
      
      /* Section Headers */
      .section__title {
        font-size: clamp(1.75rem, 6vw, var(--text-3xl));
        margin-bottom: var(--space-3);
      }
      
      .section__subtitle {
        font-size: var(--text-base);
      }
      
      /* Grids - Single Column */
      .industries__grid,
      .tech__grid,
      .arsenal__grid,
      .manifest__grid,
      .revolution__timeline,
      .allianz__grid {
        grid-template-columns: 1fr;
        gap: var(--space-4);
      }
      
      /* Cards */
      .tech__card,
      .arsenal__card,
      .manifest__card,
      .industry {
        padding: var(--space-5);
      }
      
      /* Stats */
      .hero__stats,
      .tech__number,
      .arsenal__number {
        font-size: var(--text-3xl);
      }
      
      /* Footer */
      .footer__grid {
        grid-template-columns: 1fr;
        gap: var(--space-6);
        text-align: center;
      }
      
      .footer__bottom {
        flex-direction: column;
        gap: var(--space-4);
        text-align: center;
      }
      
      /* CTA Buttons */
      .cta__buttons {
        flex-direction: column;
        gap: var(--space-3);
      }
      
      .btn {
        width: 100%;
        justify-content: center;
      }
      
      /* Founder Section */
      .founder__content {
        grid-template-columns: 1fr;
        text-align: center;
      }
      
      .founder__image {
        max-width: 250px;
        margin: 0 auto var(--space-6);
      }
      
      .founder__stats {
        grid-template-columns: 1fr;
        gap: var(--space-4);
      }
      
      /* Allianz Section */
      .allianz__intro {
        padding: var(--space-6);
      }
      
      /* Protocol Steps */
      .protocol__step {
        grid-template-columns: 60px 1fr;
        gap: var(--space-4);
      }
      
      .protocol__step-number {
        width: 60px;
        height: 60px;
        font-size: var(--text-xl);
      }
      
      /* Scenarios */
      .scenarios {
        grid-template-columns: 1fr;
        gap: var(--space-4);
      }
      
      /* Partner Cards */
      .partner__card {
        grid-template-columns: 1fr;
        gap: var(--space-6);
      }
      
      /* Products Grid */
      .products {
        grid-template-columns: 1fr;
        gap: var(--space-4);
      }
      
      /* Qualification Cards */
      .qualification__grid {
        grid-template-columns: 1fr;
        gap: var(--space-4);
      }
      
      .qualification__promise-paths {
        grid-template-columns: 1fr;
      }
      
      /* Financing Banner */
      .financing-banner__wrapper {
        grid-template-columns: 1fr;
        text-align: center;
      }
      
      .financing-banner__rate-box {
        justify-self: center;
        margin-bottom: var(--space-4);
      }
      
      .financing-banner__features {
        flex-direction: column;
        align-items: stretch;
      }
    }
    
    /* === MOBILE (max-width: 480px) === */
    @media (max-width: 480px) {
      :root {
        --space-24: 3rem;
        --space-20: 2.5rem;
        --space-16: 2rem;
        --space-12: 1.5rem;
        --space-8: 1.5rem;
        --space-6: 1rem;

      }
      
      .container {
        padding: 0 var(--space-3);

        font-size: clamp(1.5rem, 10vw, var(--text-3xl));

      .section__title {
        font-size: clamp(1.5rem, 8vw, var(--text-2xl));
      }

      .hero__badge {
        font-size: var(--text-xs);
        padding: var(--space-2) var(--space-3);
      }
      
      .hero__stat-value {
        font-size: var(--text-xl);
      }
      
      /* Cards - Compact */
      .tech__card,
      .arsenal__card,
      .manifest__card,
      .industry {
        padding: var(--space-4);
      }
      
      .tech__icon,
      .arsenal__icon {
        font-size: var(--text-2xl);
      }
      
      /* Buttons */
      .btn {
        padding: var(--space-3) var(--space-5);
        font-size: var(--text-sm);
      }
      
      /* Navigation */
      .nav__brand {
        font-size: var(--text-base);
      }
      
      .nav__brand-icon {
        width: 28px;
        height: 28px;
      }
      
      /* Footer */
      .footer {
        padding: var(--space-12) 0 var(--space-6);
      }
      
      /* Spacing Reductions */
      section {
        padding: var(--space-12) 0;
      }
      
      .section__header {
        margin-bottom: var(--space-8);
      }
    }
    
    /* === LARGE DESKTOP (min-width: 1400px) === */
    @media (min-width: 1400px) {
      .container {
        max-width: 1400px;
      }
      
      .hero__title {
        font-size: var(--text-6xl);
      }
      
      .industries__grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    
    /* === LANDSCAPE ORIENTATION === */
    @media (max-width: 768px) and (orientation: landscape) {
      .hero {
        min-height: auto;
        padding-top: calc(var(--nav-height) + var(--space-4));
        padding-bottom: var(--space-8);
      }
      
      .hero__stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    /* === PRINT STYLES === */
    @media print {
      .nav,
      .nav__menu,
      .btn,
      .skip-link {
        display: none;
      }

}
      
      .container {
        max-width: 100%;

/* ============================================
   FINAL LAYOUT FIX - SECTIONS UNTEREINANDER
   ============================================ */

html, body {
  overflow-x: hidden !important;
}

body {
  display: block !important;
  min-height: 100vh !important;
}

/* Sektionen MÜSSEN untereinander sein */
section,
.hero,
.manifest,
.revolution,
.arsenal,
.allianz,
.founder,
.cta,
footer {
  display: block !important;
  width: 100% !important;
  clear: both !important;
  float: none !important;
  position: relative !important;
  box-sizing: border-box !important;
}

/* Container zentrieren aber nicht nebeneinander */
.container {
  display: block !important;
  width: 100% !important;
  max-width: 1200px !important;
  margin-left: auto !important;
  margin-right: auto !important;
  box-sizing: border-box !important;
}

/* Grid-Layouts nur für INHALT, nicht für Sektionen */
.manifest__grid { 
  display: grid !important; 
  grid-template-columns: repeat(2, 1fr) !important; 
  gap: 1.5rem !important;
}

.arsenal__grid { 
  display: grid !important; 
  grid-template-columns: repeat(3, 1fr) !important; 
  gap: 1.5rem !important;
}

.industries__grid { 
  display: grid !important; 
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)) !important; 
  gap: 1.5rem !important;
}

.founder__content { 
  display: grid !important; 
  grid-template-columns: 280px 1fr !important; 
  gap: 2rem !important;
}

/* Navigation volle Breite — Leiste bleibt beim Scrollen sichtbar (inkl. Mobile) */
.nav {
  width: 100vw !important;
  max-width: 100vw !important;
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  z-index: 9999 !important;
  -webkit-transform: translate3d(0, 0, 0);
  transform: translate3d(0, 0, 0);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.nav__inner {
  width: 100% !important;
  max-width: 1400px !important;
  margin: 0 auto !important;
  padding: 0 2rem !important;
  display: flex !important;
  justify-content: space-between !important;
  align-items: center !important;
}

@media (min-width: 769px) {
  .nav__menu {
    display: flex !important;
    gap: 1.5rem !important;
  }
}

@media (max-width: 768px) {
  .nav__menu {
    display: flex !important;
    flex-direction: column !important;
    align-items: stretch !important;
  }
}

/* Scrolling erlauben */
html {
  overflow-y: scroll !important;
  overflow-x: hidden !important;
}

body {
  overflow-y: auto !important;
  overflow-x: hidden !important;
}

/* Responsive: Alles untereinander auf Mobile */
@media (max-width: 1024px) {
  .manifest__grid,
  .arsenal__grid,
  .industries__grid,
  .founder__content {
    grid-template-columns: 1fr !important;
  }
}
